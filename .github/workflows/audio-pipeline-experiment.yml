name: TingX audio pipeline experiment
on:
  push:
    branches:
      - experiment/audio-pipeline
  workflow_dispatch:
jobs:
  audio-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/player/audio_http_probe.dart test/audio_http_probe_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Probe regression test
        run: flutter test test/audio_http_probe_test.dart --reporter expanded
