name: TingX audio pipeline experiment
on:
  push:
    branches:
      - experiment/audio-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  audio-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format experimental sources for analysis
        run: dart format lib/player/listening_session.dart lib/player/audio_http_probe.dart lib/player/bili_stream_audio_source.dart test/audio_http_probe_test.dart test/bili_stream_audio_source_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Probe regression test
        run: flutter test test/audio_http_probe_test.dart test/bili_stream_audio_source_test.dart --reporter expanded
