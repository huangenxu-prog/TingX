name: TingX iOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'tool/prepare_ios.sh'
      - '.github/workflows/tingx-ios.yml'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: bash tool/prepare_ios.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test integration_test
      - run: flutter test
      - name: Verify chapter playback and resume on iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl bootstatus "$DEVICE" -b
          flutter test integration_test/ios_listening_test.dart -d "$DEVICE"
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --keepParent Payload TingX-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TingX-unsigned
          path: TingX-unsigned.ipa
          if-no-files-found: error
