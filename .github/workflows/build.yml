name: Build TingX iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tingx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify imported chapters and narration segments
        run: |
          set -o pipefail
          xcodebuild -project TingX.xcodeproj -scheme ListeningChecks -configuration Debug -destination 'platform=macOS' -derivedDataPath CheckBuild CODE_SIGNING_ALLOWED=NO build | tee checks.log
          CheckBuild/Build/Products/Debug/ListeningChecks Tests/Fixtures
      - name: Build iOS simulator
        run: |
          set -o pipefail
          xcodebuild -project TingX.xcodeproj -scheme TingX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee simulator.log
      - name: Build iPhone
        run: |
          set -o pipefail
          xcodebuild -project TingX.xcodeproj -scheme TingX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO build | tee device.log
      - name: Fetch and verify bundled Mandarin voice
        run: python3 Scripts/fetch-model.py DeviceBuild/Build/Products/Release-iphoneos/TingX.app/CosyVoice3
      - name: Synthesize Mandarin with packaged assets
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild -project TingX.xcodeproj -scheme VoiceCheck -configuration Release -destination 'platform=macOS' -derivedDataPath CheckBuild CODE_SIGNING_ALLOWED=NO build | tee voice-check.log
          CheckBuild/Build/Products/Release/VoiceCheck DeviceBuild/Build/Products/Release-iphoneos/TingX.app/CosyVoice3 2>&1 | tee -a voice-check.log
      - uses: actions/upload-artifact@v4
        with:
          name: CosyVoice3-sample
          path: cosyvoice-check.wav
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          mv DeviceBuild/Build/Products/Release-iphoneos/TingX.app package/Payload/
          cd package && zip -q -1 -r ../TingX-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TingX-unsigned
          path: TingX-unsigned.ipa
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TingX-build-logs
          path: |
            voice-check.log
            checks.log
            simulator.log
            device.log
