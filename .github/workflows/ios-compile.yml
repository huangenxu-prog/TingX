name: TingX iOS compile verification
concurrency:
  group: tingx-ios-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/**'
      - 'assets/IMG_2691.png'
      - 'pubspec.yaml'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project if absent
        run: flutter create --platforms=ios --project-name tingx .
      - name: Remove Flutter-generated counter template test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'Counter increments smoke test' test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
            echo 'Removed generated counter demo test; preserving TingX regression tests.'
          fi
      - name: Install TingX app icon from uploaded artwork
        run: |
          python3 scripts/install_ios_icon.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source for analysis
        run: dart format lib
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run regression tests
        run: flutter test --reporter expanded
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign
      - name: Capture environment on failure
        if: failure()
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version
