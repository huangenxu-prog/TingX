name: TingX iOS compile verification
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/**'
      - 'assets/IMG_2691.png'
      - 'pubspec.yaml'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project if absent
        run: flutter create --platforms=ios --project-name tingx .
      - name: Install TingX app icon from uploaded artwork
        run: |
          python3 scripts/install_ios_icon.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source for analysis
        run: dart format lib
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run regression tests
        run: flutter test
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign
