name: TingX iOS compile verification
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project if absent
        run: flutter create --platforms=ios --project-name tingx .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source for analysis
        run: dart format lib
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign
