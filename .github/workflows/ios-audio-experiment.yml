name: TingX iOS audio experiment
on:
  push:
    branches:
      - experiment/audio-pipeline
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-audio-experiment.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  ios-audio-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner when absent
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios --project-name tingx .
          fi
      - name: Resolve packages
        run: flutter pub get
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build iOS simulator with experimental stream enabled
        run: flutter build ios --simulator --debug --no-codesign --dart-define=TINGX_EXPERIMENTAL_STREAM=true
      - name: Compare real chapter tracks on iPhone simulator
        if: github.event_name == 'push'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl bootstatus "$DEVICE" -b
          flutter test integration_test/live_chapter_test.dart -d "$DEVICE" --dart-define=TINGX_EXPERIMENTAL_STREAM=true --reporter expanded
