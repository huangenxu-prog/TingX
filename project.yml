name: TingX
options:
  bundleIdPrefix: com.huangenxu
targets:
  TingX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingX
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.TingX
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
