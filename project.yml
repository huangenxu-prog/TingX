name: TingX
options:
  bundleIdPrefix: com.huangenxu
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: c60d13a0d585d204d1d3fbe85aa7a36c731800d6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  TingX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingX
    dependencies:
      - package: ZIPFoundation
      - package: FluidAudio
    info:
      path: Generated/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.TingX
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  ListeningChecks:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/main.swift
      - path: TingX/BookText.swift
      - path: TingX/ListeningBook.swift
    dependencies:
      - package: ZIPFoundation
  VoiceCheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/Voice/main.swift
      - path: TingX/CosyVoice.swift
    dependencies:
      - package: FluidAudio
